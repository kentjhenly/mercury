# Mercury inbound-email Worker. Deployed separately from the Next app.
#
# Setup:
#   1. In the Cloudflare dashboard, enable Email Routing on your apply domain
#      (e.g. apply.mercury.com) and verify the MX records.
#   2. Add a catch-all rule routing every address → this Worker, so
#      apply+<token>@apply.mercury.com all arrive at the email() handler.
#   3. Set the two secrets (never commit them):
#        wrangler secret put INBOUND_SECRET        # must equal the app's INBOUND_SECRET
#        wrangler secret put MERCURY_INGEST_URL    # https://<app>/api/mercury/inbound
#   4. wrangler deploy

name = "mercury-email-worker"
main = "src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
